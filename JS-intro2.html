<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Light Switch</title>
</head>
<body>
    <h2>What can JavaScript do?</h2>
    <p>Click a button to switch the light on or off.</p>
 
    <button id="turnOn">Turn on the light</button>
    <img id="myImage" alt="Light bulb" width="100">
    <button id="turnOff">Turn off the light</button>
 
    <script>
        const bulb = document.getElementById("myImage");
 
        const bulbOff = "data:image/svg+xml," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="140" viewBox="0 0 100 140"><path d="M50 8 C20 8 8 32 18 57 C23 69 34 76 36 91 H64 C66 76 77 69 82 57 C92 32 80 8 50 8Z" fill="#b8c1c8" stroke="#52616b" stroke-width="4"/><path d="M36 96 H64 M38 105 H62 M42 114 H58" stroke="#52616b" stroke-width="5" stroke-linecap="round"/></svg>'
        );
 
        const bulbOn = "data:image/svg+xml," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="140" viewBox="0 0 100 140"><path d="M50 8 C20 8 8 32 18 57 C23 69 34 76 36 91 H64 C66 76 77 69 82 57 C92 32 80 8 50 8Z" fill="#ffe36e" stroke="#d49a00" stroke-width="4"/><path d="M36 96 H64 M38 105 H62 M42 114 H58" stroke="#52616b" stroke-width="5" stroke-linecap="round"/></svg>'
        );
 
        bulb.src = bulbOff;
 
        document.getElementById("turnOn").addEventListener("click", function () {
            bulb.src = bulbOn;
        });
 
        document.getElementById("turnOff").addEventListener("click", function () {
            bulb.src = bulbOff;
        });
    </script>
</body>
</html>
